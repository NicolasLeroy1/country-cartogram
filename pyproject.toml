[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "country-cartogram"
version = "0.2.0"
description = "Shape-preserving country cartograms with gradual resizing and clustered rigid-body physics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Country Cartogram contributors"}]
keywords = ["cartogram", "geography", "data-visualization", "physics", "shapely"]
dependencies = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "shapely>=2.1,<3",
  "pyproj>=3.6,<4",
  "pymunk>=7.1,<8",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2"]
"3d" = ["plotly>=6,<7"]

[project.scripts]
country-cartogram = "country_cartogram.pipeline:main"
country-cartogram-restyle = "country_cartogram.restyle:main"
country-cartogram-3d = "country_cartogram.extrusion:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
country_cartogram = ["data/*.geojson", "data/*.json", "data/*.csv"]
