[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "country-cartogram"
version = "0.6.0"
description = "Polygon cartograms with gradual resizing, groups and continuous time series"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/country_cartogram/web/THREE-LICENSE.txt"]
authors = [{name = "Country Cartogram contributors"}]
keywords = ["cartogram", "geography", "data-visualization", "physics", "shapely"]
dependencies = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "shapely>=2.1,<3",
  "pyproj>=3.6,<4",
  "pymunk>=7.1,<8",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff==0.14.1"]

[project.scripts]
country-cartogram = "country_cartogram.pipeline:main"
country-cartogram-restyle = "country_cartogram.restyle:main"
country-cartogram-3d = "country_cartogram.extrusion:main"
country-cartogram-timeline = "country_cartogram.timeline:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["country_cartogram*"]
namespaces = true

[tool.setuptools.package-data]
country_cartogram = [
  "data/*.geojson", "data/*.json", "data/*.csv",
  "web/*.js", "web/*.html", "web/*.css", "web/*.glsl", "web/*.txt",
]
