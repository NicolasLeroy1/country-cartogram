name: Tests and packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and build tool
        run: python -m pip install '.[dev]'
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check packaged geography and command
        run: |
          python -m venv /tmp/cartogram-wheel-check
          /tmp/cartogram-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/cartogram-wheel-check/bin/country-cartogram --help
          /tmp/cartogram-wheel-check/bin/python -c "from country_cartogram.pipeline import ROOT, load_catalog; assert len(load_catalog(ROOT / 'data/countries.geojson')) == 233"
