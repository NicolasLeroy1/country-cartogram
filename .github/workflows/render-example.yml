name: Render a complete example

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Historical demonstration dataset
        required: true
        default: gdp
        type: choice
        options:
          - gdp
          - population
          - population-gdp

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[3d]'
      - name: Generate and audit the cartogram
        env:
          DATASET: ${{ inputs.dataset }}
        run: |
          if [ "$DATASET" = "population-gdp" ]; then
            country-cartogram examples/population-gdp.csv --value-column population --volume-column gdp_usd \
              --config examples/population-gdp.json --config-3d examples/population-gdp.3d.json \
              --out output/population-gdp --preview-3d
          else
            country-cartogram "examples/${DATASET}.csv" --config "examples/${DATASET}.json" --out "output/${DATASET}" --animate
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cartogram-${{ inputs.dataset }}
          path: output/
          if-no-files-found: error
          retention-days: 14
